name: Release Build (Windows)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            arch: x64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            arch: arm64

    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Import code-signing certificate
        if: env.CODESIGN_PFX_BASE64 != ''
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          echo "CODESIGN_PFX_PATH=$pfxPath" >> $env:GITHUB_ENV

      - name: Build Tauri app (MSI + NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CODESIGN_PFX_PATH: ${{ env.CODESIGN_PFX_PATH }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'JiraTime ${{ github.ref_name }}'
          releaseBody: |
            ## Что нового
            _См. CHANGELOG.md_

            ## Установка
            - **JiraTime-${{ github.ref_name }}-x64-setup.exe** — установщик NSIS для Windows 10/11 x64
            - **JiraTime-${{ github.ref_name }}-x64.msi** — MSI (WiX) для корпоративной раздачи
            - **JiraTime-${{ github.ref_name }}-arm64-setup.exe** — Windows on ARM
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles msi,nsis

      - name: Clean up PFX
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:CODESIGN_PFX_PATH) {
            Remove-Item $env:CODESIGN_PFX_PATH -Force
          }
