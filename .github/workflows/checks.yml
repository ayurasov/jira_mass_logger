# Прежний ci.yml выключен в настройках репозитория (disabled_manually) — новый путь
# регистрируется как новый, включённый workflow.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Интерфейс: типы, тесты логики (vitest) и production-сборка.
  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx vue-tsc --noEmit -p tsconfig.json

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npx vite build

  # Rust: компиляция и тесты на целевых платформах сборки.
  rust:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-

      # generate_context!() встраивает фронтенд из ../dist — для тестов хватает заглушки.
      - name: Placeholder frontend dist
        shell: bash
        run: mkdir -p dist && [ -f dist/index.html ] || echo '<!doctype html><title>JiraTime</title>' > dist/index.html

      # У крейта нет lib-цели (только bin), поэтому тесты запускаем через --bins:
      # прежний `cargo test --lib` падал с «no library targets found».
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked --no-default-features --bins
