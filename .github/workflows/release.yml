name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

# При ручном запуске ref_name = 'main' — версия и changelog вычисляются джобой
# prepare-release из package.json (источник истины) и предыдущего релизного тега.
# При пуше тега ref_name = 'v1.2.3' — используем его напрямую, версия в коде уже
# должна быть проставлена вручную заранее.
env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && format('release/v{0}', needs.prepare-release.outputs.version) || github.ref_name }}
  RELEASE_NAME: ${{ github.event_name == 'workflow_dispatch' && format('JiraTime v{0}', needs.prepare-release.outputs.version) || format('JiraTime {0}', github.ref_name) }}

jobs:
  # ─────────────────────────────────────────────
  # Только для ручного запуска.
  # Версия релиза берётся из package.json (манифест в коде — источник истины,
  # правится разработчиком перед запуском). Джоба:
  #  1) читает VERSION из package.json;
  #  2) проверяет, что VERSION строго больше последнего опубликованного релизного тега;
  #  3) синхронизирует версию в src-tauri/tauri.conf.json и src-tauri/Cargo.toml;
  #  4) собирает CHANGELOG.md из commit-сообщений между прошлым релизным тегом и HEAD;
  #  5) коммитит изменения в main.
  # Сборочные джобы чекаутят именно этот коммит.
  # При запуске по тегу (push tag) вся эта джоба пропускается.
  # ─────────────────────────────────────────────
  prepare-release:
    name: Derive version + build CHANGELOG
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read target version from manifest + validate increment
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -pe "require('./package.json').version")

          LATEST_TAG=$(git tag --list 'release/v*' | sed 's#release/v##' | sort -V | tail -1 || true)
          LATEST_TAG="${LATEST_TAG:-0.0.0}"

          echo "Manifest version: $VERSION"
          echo "Latest released version: $LATEST_TAG"

          HIGHEST=$(printf '%s\n%s\n' "$LATEST_TAG" "$VERSION" | sort -V | tail -1)
          if [ "$HIGHEST" != "$VERSION" ] || [ "$LATEST_TAG" = "$VERSION" ]; then
            echo "::error::Версия в манифесте ($VERSION) должна быть строго больше последней выпущенной ($LATEST_TAG). Обновите version в package.json перед запуском релиза."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Sync version into tauri.conf.json and Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            p.version = '$VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(p, null, 2) + '\n');
          "

          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml

          echo "--- package.json ---"; grep '"version"' package.json
          echo "--- tauri.conf.json ---"; grep '"version"' src-tauri/tauri.conf.json
          echo "--- Cargo.toml ---"; grep -m1 '^version' src-tauri/Cargo.toml

      - name: Generate CHANGELOG.md entry from commits since last release
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          LATEST_TAG="${{ steps.version.outputs.latest_tag }}"
          PREV_REF="release/v$LATEST_TAG"

          if git rev-parse "$PREV_REF" >/dev/null 2>&1; then
            RANGE="$PREV_REF..HEAD"
          else
            RANGE="HEAD"
          fi

          ENTRIES=$(git log $RANGE --no-merges --pretty=format:'- %s (%h)')
          if [ -z "$ENTRIES" ]; then
            ENTRIES="- Без изменений в коде с прошлого релиза."
          fi

          DATE=$(date -u +%Y-%m-%d)
          {
            echo "## v$VERSION - $DATE"
            echo ""
            echo "$ENTRIES"
            echo ""
          } > /tmp/new_entry.md

          if [ -f CHANGELOG.md ]; then
            cat /tmp/new_entry.md CHANGELOG.md > /tmp/CHANGELOG.md.new
          else
            {
              echo "# Changelog"
              echo ""
              cat /tmp/new_entry.md
            } > /tmp/CHANGELOG.md.new
          fi
          mv /tmp/CHANGELOG.md.new CHANGELOG.md

          {
            echo "changelog<<CHANGELOG_EOF"
            cat /tmp/new_entry.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: release v${{ steps.version.outputs.version }} — bump version + changelog"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # Windows x64 + arm64
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Decode codesign certificate
        if: env.CODESIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64)
          $certPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($certPath, $bytes)
          echo "CODESIGN_PFX_PATH=$certPath" >> $env:GITHUB_ENV
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
          RUST_BACKTRACE: 1
        with:
          tagName: ${{ env.TAG_NAME }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ needs.prepare-release.outputs.changelog || 'See CHANGELOG.md for details.' }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 5

  # ─────────────────────────────────────────────
  # macOS arm64 + x64
  # ─────────────────────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build Tauri app (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RUST_BACKTRACE: 1
        with:
          tagName: ${{ env.TAG_NAME }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ needs.prepare-release.outputs.changelog || 'See CHANGELOG.md for details.' }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 5
