name: Integration Tests (offline-to-sync)

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/src/sync_queue*.rs'
      - 'src-tauri/src/logger*.rs'
      - 'src-tauri/src/network.rs'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [main]

jobs:
  integration-tests:
    name: Run offline->sync integration tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies (WebView2 runtime is pre-installed on windows-latest)
        run: |
          echo "WebView2 runtime pre-installed, nothing extra needed"
        shell: pwsh

      - name: Run integration tests (offline_to_sync)
        working-directory: src-tauri
        run: cargo test --lib --tests -- offline_to_sync --nocapture
        env:
          RUST_LOG: debug
          RUST_BACKTRACE: 1
          # Отключаем openssl-излишества для wiremock на Windows
          OPENSSL_NO_VENDOR: "1"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: src-tauri/target/debug/
          retention-days: 3
