name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  integration-tests:
    name: Rust Integration Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # WebView2 runtime нужен для сборки Tauri, но не для Rust unit-тестов
      - name: Install Tauri prerequisites
        run: |
          choco install -y visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools"
        continue-on-error: true

      # Устанавливаем Node.js для генерации Tauri context (tauri::generate_context! макро)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: .
        run: npm ci
        continue-on-error: true

      # Запускаем только Rust-тесты (lib + integration), без сборки всего приложения
      - name: Run integration tests
        working-directory: src-tauri
        run: |
          cargo test --lib --tests -- offline_to_sync --nocapture 2>&1
        env:
          RUST_LOG: debug
          # Отключаем Tauri custom protocol чтобы избежать необходимости UI-рантайма
          TAURI_SKIP_DEVSERVER_CHECK: "true"

      # Дополнительно запускаем rate-limit и permanent-error тесты
      - name: Run resilience tests
        working-directory: src-tauri
        run: |
          cargo test --lib --tests -- test_rate_limit_then_retry_success test_permanent_error_goes_to_failed --nocapture 2>&1
        env:
          RUST_LOG: debug

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: src-tauri/target/debug/*.log
          if-no-files-found: ignore
