[package]
name = "jiratime"
version = "0.1.0"
description = "JiraTime - массовое логирование времени в Jira"
edition = "2021"

# Целевые ОС: Windows 10 и Windows 11 (x86_64-pc-windows-msvc).
# Сборка: `rustup target add x86_64-pc-windows-msvc` + MSVC Build Tools (C++ workload).
# Кросс-сборка с macOS/Linux не поддерживается nativeо — используй CI с `windows-latest` runner.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
keyring = { version = "2", features = ["windows-native"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# rustls-tls важен иименно для Windows: не зависит от системных корпоративных SSL-инспекторов/proxy
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
anyhow = "1"
thiserror = "1"
# --- Exchange/Microsoft Graph интеграция (Промпт 5) ---
# oauth2: PKCE Authorization Code flow (MSAL-стиль) без полного MSAL SDK,
# который для Rust отсутствует.
oauth2 = "4"
# tiny_http: локальный loopback-листенер http://localhost:PORT/callback для
# захвата authorization code без внешних зависимостей от тяжёлого async-стека.
tiny_http = "0.12"
# sspi: чистый Rust, без платформо-зависимых cfg-гейтов в NTLM-модуле,
# реализация NTLMSSP (Negotiate/Challenge/Authenticate) для SOAP-запросов к on-premise
# EWS в доменах Active Directory. Работает на Windows 10/11 без внешних systemwide
# зависимостей и без необходимости WinHTTP FFI-обёртки.
sspi = "0.21"
# quick-xml: парсинг SOAP-ответов EWS FindItem (CalendarItem элементы).
quick-xml = "0.36"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
# urlencoding: query-параметры Graph calendarview (startDateTime/endDateTime в ISO 8601
# могут содержать символы, требующие percent-encoding, например '+' и ':').
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# whoami: для NTLM identity нужно знать NetBIOS-домен/хост текущего Windows-пользователя,
# если он не указан явно в виде DOMAIN\\user в настройках.
whoami = "1"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
