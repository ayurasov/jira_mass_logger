[package]
name = "jiratime"
version = "0.1.0"
description = "JiraTime - массовое логирование времени в Jira"
edition = "2021"

# Целевые ОС: Windows 10 и Windows 11 (x86_64-pc-windows-msvc).
# Сборка: `rustup target add x86_64-pc-windows-msvc` + MSVC Build Tools (C++ workload).
# Кросс-сборка с macOS/Linux не поддерживается nativно — используй CI с `windows-latest` runner.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
keyring = { version = "2", features = ["windows-native"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# rustls-tls важен именно для Windows: не зависит от системных корпоративных SSL-инспекторов/proxy
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
anyhow = "1"
thiserror = "1"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
