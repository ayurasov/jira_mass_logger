[package]
name = "jiratime"
version = "0.1.0"
description = "JiraTime - массовое логирование времени в Jira"
edition = "2021"

# Целевые ОС: Windows 10 и Windows 11 (x86_64-pc-windows-msvc).
# Сборка: `rustup target add x86_64-pc-windows-msvc` + MSVC Build Tools (C++ workload).
# Кросс-сборка с macOS/Linux не поддерживается nativno — используй CI с `windows-latest` runner.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
# Автообновление через GitHub Releases (Промпт 10)
tauri-plugin-updater = "2"
# keyring v2: на Windows использует Windows Credential Manager через default features.
# Фича 'windows-native' была удалена в keyring ещё до v2.0.0.
keyring = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
# rustls-tls важен для Windows: не зависит от системных SSL-инспекторов/proxy
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
anyhow = "1"
thiserror = "1"
# log — фасад логирования, используется в jira_client и других модулях.
# Tauri 2 подтягивает log как транзитивную зависимость, но явное объявление
# гарантирует доступность макросов log::debug!/info!/error! без use.
log = "0.4"
# --- Exchange/Microsoft Graph интеграция (Промпт 5) ---
oauth2 = "4"
tiny_http = "0.12"
sspi = "0.21"
quick-xml = "0.36"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
# regex: правила сопоставления темы встречи с задачей Jira (Промпт 6)
regex = "1"

[target.'cfg(windows)'.dependencies]
whoami = "1"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
